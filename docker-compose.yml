services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: auth_db
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

  meetings-service:
    build: ./meetings-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: meetings_db
      DB_USERNAME: root
      DB_PASSWORD: root
      AUTH_SERVICE_URL: http://auth-service:8081
      EXPORT_SERVICE_URL: http://export-service:8083
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
      export-service:
        condition: service_started

  export-service:
    build: ./export-service
    ports:
      - "8083:8083"

  frontend:
    build:
      context: ./is-sastanak-front
      args:
        VITE_AUTH_SERVICE_URL: http://localhost:8081
        VITE_MEETINGS_SERVICE_URL: http://localhost:8082
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - meetings-service

volumes:
  mysql-data:
